name: Verify live Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-pages.yml']
  workflow_run:
    workflows: ['Build static CDN frontend']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issho-jleague-pages-verification
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-site
          path: published
      - name: Check live HTML, assets, robots, sitemap and 404
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          root = pathlib.Path("published")
          origin = "https://issho-jleague.pages.dev"
          def read(path):
              with urllib.request.urlopen(origin + path, timeout=30) as r:
                  assert urlparse(r.geturl()).netloc == "issho-jleague.pages.dev", r.geturl()
                  assert r.status == 200, (path, r.status)
                  return r.read(), dict(r.headers)
          # Wait for the independent Cloudflare Git deployment to serve this snapshot.
          expected = (root / "players/index.html").read_bytes()
          for attempt in range(24):
              try:
                  body, _ = read("/players/")
                  if hashlib.sha256(body).digest() == hashlib.sha256(expected).digest():
                      break
                  if attempt % 4 == 0:
                      print("Waiting for current Pages snapshot", len(body), len(expected), flush=True)
              except urllib.error.HTTPError as e:
                  if e.code in (401, 403):
                      raise SystemExit("Live verification denied: HTTP " + str(e.code))
                  print("Waiting for Pages response: HTTP", e.code, flush=True)
              except Exception as e:
                  print("Waiting for Pages response:", type(e).__name__, flush=True)
              time.sleep(10)
          else:
              raise SystemExit("Cloudflare has not served the latest static-site snapshot yet.")
          paths = ["/", "/clubs/", "/players/", "/schedule/", "/results/", "/standings/", "/stadiums/"]
          for kind in ("club", "player", "stadium"):
              p = next(iter(sorted(root.glob(kind + "/*/index.html"))))
              paths.append("/" + p.parent.relative_to(root).as_posix() + "/")
          for path in paths:
              data, headers = read(path)
              html = data.decode("utf-8")
              assert "<h1" in html and "\ufffd" not in html, path
              assert "onrender.com" not in html, path
              assert "/static/app.css" in html and "/static/fan.css" in html, path
              print("HTML OK", path, headers.get("Server", headers.get("server", "")))
          for path in ["/static/app.css", "/static/fan.css", "/static/filters.js"]:
              data, _ = read(path)
              assert data, path
              print("ASSET OK", path)
          robots, _ = read("/robots.txt")
          assert ("Sitemap: " + origin + "/sitemap.xml").encode() in robots
          sitemap, _ = read("/sitemap.xml")
          urls = [loc.text for loc in ET.fromstring(sitemap).findall(".//{*}loc")]
          assert len(urls) >= 2384
          assert all(urlparse(u).netloc == "issho-jleague.pages.dev" for u in urls)
          print("ROBOTS OK; SITEMAP OK", len(urls))
          try:
              read("/deployment-check-missing-page-20260917")
              raise AssertionError("Unknown URL should return HTTP 404")
          except urllib.error.HTTPError as e:
              assert e.code == 404, e.code
              assert "ページが見つかりません" in e.read().decode("utf-8")
          print("404 OK")
          PY
