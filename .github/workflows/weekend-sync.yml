name: Weekend J.League data sync

on:
  schedule:
    # 23:30 JST = 14:30 UTC.
    - cron: '30 14 * * 6' # Saturday: results + standings
    - cron: '30 14 * * 0' # Sunday: results + standings + roster
  workflow_dispatch:
  # Temporary validation trigger. Removed after validation succeeds.
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekend-sync.yml'
      - 'scripts/sync_competition_data.py'
      - 'scripts/sync_standings.py'

permissions:
  contents: read

concurrency:
  group: issho-jleague-weekend-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database secret exists
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is not configured."
            exit 1
          fi

      - name: Sync league standings
        run: python scripts/sync_standings.py

      - name: Sync match results
        run: python scripts/sync_competition_data.py

      - name: Weekly roster and stadium refresh
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * 0'
        env:
          RUN_FULL_SYNC: '1'
        run: python scripts/sync_jleague.py

      - name: Verify sync coverage
        run: |
          python - <<'PY'
          from sqlalchemy import select, func, text
          from app import SessionLocal, Club, Player, engine

          with SessionLocal() as db:
              clubs = db.scalar(select(func.count()).select_from(Club)) or 0
              players = db.scalar(select(func.count()).select_from(Player)) or 0
              clubs_with_players = db.scalar(
                  select(func.count(func.distinct(Player.club_id)))
              ) or 0
          with engine.begin() as conn:
              standings = conn.execute(text('SELECT COUNT(*) FROM standings')).scalar_one()
              results = conn.execute(text('SELECT COUNT(*) FROM club_results')).scalar_one()

          print(
              f"clubs={clubs} players={players} clubs_with_players={clubs_with_players} "
              f"standings={standings} results={results}"
          )
          if clubs < 60 or clubs_with_players < 60 or players < 1000 or standings < 60 or results < 50:
              raise SystemExit("Sync coverage check failed")
          PY
