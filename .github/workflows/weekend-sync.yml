name: Weekend J.League data sync

on:
  schedule:
    # 23:30 JST = 14:30 UTC. Run Saturday and Sunday.
    - cron: '30 14 * * 6,0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issho-jleague-weekend-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RUN_FULL_SYNC: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database secret exists
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is not configured."
            exit 1
          fi

      - name: Sync J.League roster and stadium facts
        run: python scripts/sync_jleague.py

      - name: Verify sync coverage
        run: |
          python - <<'PY'
          from sqlalchemy import select, func
          from app import SessionLocal, Club, Player

          with SessionLocal() as db:
              clubs = db.scalar(select(func.count()).select_from(Club)) or 0
              players = db.scalar(select(func.count()).select_from(Player)) or 0
              clubs_with_players = db.scalar(
                  select(func.count(func.distinct(Player.club_id)))
              ) or 0

          print(f"clubs={clubs} players={players} clubs_with_players={clubs_with_players}")
          if clubs < 60 or clubs_with_players < 60 or players < 1000:
              raise SystemExit("Sync coverage check failed")
          PY
