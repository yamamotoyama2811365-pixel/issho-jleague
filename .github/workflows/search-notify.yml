name: Notify search engines of published updates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/search-notify.yml']
  workflow_dispatch:
  schedule:
    - cron: '55 13,21 * * *'
    # Notify after the weekend pre-match refresh (11:55 JST).
    - cron: '55 2 * * 6,0'
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests
      - run: python scripts/notify_search.py ${{ github.event_name == 'push' && '--all' || '' }}
