name: Build static CDN frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'club_hub.py'
      - 'data/**'
      - 'scripts/sync_club_content.py'
      - 'templates/**'
      - 'static/**'
      - 'scripts/export_static.py'
      - 'scripts/sync_fixtures.py'
      - 'tests/**'
      - '.github/workflows/static-publish.yml'
  schedule:
    # Refresh the next round every morning/evening (06:20 / 22:20 JST).
    - cron: '20 13,21 * * *'

permissions:
  contents: write

concurrency:
  group: issho-jleague-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STATIC_SITE_URL: https://issho-jleague.pages.dev
      DYNAMIC_ORIGIN: https://issho-jleague.onrender.com
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database secret
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo 'DATABASE_URL secret missing'; exit 1; }

      - name: Check fixture parsing and round selection
        run: python -m unittest discover -s tests

      - name: Refresh verified fixtures
        run: python scripts/sync_fixtures.py

      - name: Refresh Sapporo news and full schedule
        run: python scripts/sync_club_content.py

      - name: Export static site
        run: python scripts/export_static.py

      - name: Validate static output
        shell: bash
        run: |
          test -s public/index.html
          test -s public/schedule/index.html
          test -s public/clubs/index.html
          test -s public/players/index.html
          test -s public/sitemap.xml
          pages=$(find public -name index.html | wc -l)
          echo "static pages=$pages"
          test "$pages" -ge 2200

      - name: Prepare publish tree
        shell: bash
        run: |
          rm -rf /tmp/issho-static
          mkdir -p /tmp/issho-static
          cp -a public/. /tmp/issho-static/
          touch /tmp/issho-static/.nojekyll

      - name: Publish static-site branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan static-site
          git rm -rf .
          # Remove generated/ignored build files from this disposable checkout.
          # Otherwise public/ is copied into itself and Python caches get published.
          git clean -fdx
          cp -a /tmp/issho-static/. .
          test ! -e public
          test ! -e __pycache__
          git add -A
          git commit -m "Publish static fan frontend ${GITHUB_SHA::7}"
          git push --force origin static-site
