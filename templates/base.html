<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="J1・J2・J3のクラブ、選手、スタジアム、遠征情報、10問クイズとランキングをまとめたJリーグファン向けポータル。">
  <title>{% block title %}MATCHDAY | 一生Jリーグ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">MATCHDAY <span>一生Jリーグ</span></a>
    <nav>
      <a href="/clubs">クラブ</a>
      <a href="/players">全選手</a>
      <a href="/stadiums">スタジアム</a>
      <a href="/quiz">10問クイズ</a>
      <a href="/leaderboard">ランキング</a>
    </nav>
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site-footer">
  <div class="wrap">非公式ファンサイト。公式のロゴ・エンブレム・選手写真・座席図は転載せず、事実情報と独自図解を中心に構成します。</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
