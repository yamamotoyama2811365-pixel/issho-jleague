<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="J1・J2・J3の試合日程、チケット、会場ガイド、全クラブ、全選手、順位、試合結果をまとめたJリーグファン向けポータル。">
  <title>{% block title %}MATCHDAY | 一生Jリーグ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='fan.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">MATCHDAY <span>一生Jリーグ</span></a>
    <nav>
      <a class="nav-primary" href="/schedule">日程・チケット</a>
      <a href="/clubs">クラブ</a>
      <a href="/players">選手</a>
      <a href="/stadiums">会場ガイド</a>
      <a href="/standings">順位</a>
      <a href="/results">結果</a>
      <a href="/quiz">クイズ</a>
    </nav>
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site-footer">
  <div class="wrap">非公式ファンサイト。チケット購入は公式販売ページへ案内します。公式ロゴ・エンブレム・選手写真・座席図は転載せず、事実情報と独自図解を中心に構成します。</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
